name: SiteGuard Test & E2E Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  unit-and-typecheck:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e-playwright:
    name: Full Playwright E2E Suite (Chromium)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: unit-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E Suite
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload Screenshot Gallery & Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteguard-e2e-results-and-gallery
          path: |
            test-results/
            playwright-report/
          retention-days: 14
